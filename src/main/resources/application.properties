# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
# 24 hours in milliseconds
jwt.expiration=86400000
# Secret key - In production this should be in environment variables
jwt.secret=9a4f2c8d3b7a1e6f4c5d8e902b3a4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2
